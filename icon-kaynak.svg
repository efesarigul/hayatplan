<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B7BFF"/>
      <stop offset=".55" stop-color="#5146E8"/>
      <stop offset="1" stop-color="#2E1F9E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".22" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E2FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1B0F6B" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#sh)">
    <!-- iz halkası -->
    <circle cx="512" cy="512" r="282" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="76"/>
    <!-- ilerleme yayı (%78) -->
    <circle cx="512" cy="512" r="282" fill="none" stroke="url(#ring)" stroke-width="76" stroke-linecap="round"
            stroke-dasharray="1382 1772" transform="rotate(-90 512 512)"/>
    <!-- onay işareti -->
    <path d="M396 520 L478 600 L636 436" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
